name: Bug 反馈
description: 报告一个问题（统计口径 / 界面 / 崩溃）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认已经升级到最新 Release，并在设置页底部确认版本号。
  - type: input
    id: version
    attributes:
      label: App 版本
      description: 设置页最下方「冲了吗 vX.Y」
      placeholder: v4.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机与系统
      placeholder: Pixel 7 / Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开首页
        2. 点「记一次」
        3. 保存后回到首页
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图更好（注意遮挡个人信息）
    validations:
      required: true
