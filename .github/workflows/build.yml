name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # compileSdk = 37 对应 platforms;android-37.x（SDK 仓库里没有无后缀的 android-37）
          for pkg in "platform-tools" "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0"; do
            echo "installing $pkg"
            "$SDKM" "$pkg" || true
          done
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
