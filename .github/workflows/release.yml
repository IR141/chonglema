name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0"; do
            echo "installing $pkg"
            "$SDKM" "$pkg" || true
          done

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "chonglema-${GITHUB_REF_NAME}-release.apk"
          gh release create "${GITHUB_REF_NAME}" "chonglema-${GITHUB_REF_NAME}-release.apk" \
            --title "冲了吗 ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes-v1.1.md
